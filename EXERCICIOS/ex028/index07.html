<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Basis</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            flex-basis: auto;
        }

        div.item1 {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <h1>Teste de FlexBox</h1>
    <div class="container">
        <div class="item">A</div>
        <div class="item">BBBBBBBBBBBBBBBBBBB</div>
        <div class="item">C</div>
        <div class="item">DDDDD</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">GGG</div>
    </div>
    <br>
    <div class="container">
        <div class="item1">A</div>
        <div class="item1">BBBBBBBBBBBBBBBBBBB</div>
        <div class="item1">C</div>
        <div class="item1">DDDDD</div>
        <div class="item1">E</div>
        <div class="item1">F</div>
        <div class="item1">GGG</div>
    </div>
</body>
</html>
