<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container1 {
            display: grid;
            border: 3px solid blue;
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            padding: 10px;
            align-items: stretch;
            justify-items: stretch;
            align-content: stretch;
            justify-content: stretch;
        }
         div.container2 {
            display: grid;

            grid-template-rows: 100px 100px 100px;

            padding: 10px;
            align-items: start;
            justify-items: start;
            align-content: start;
            justify-content: start;
        }
         div.container3 {
            display: grid;
            border: 3px solid blue;
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            padding: 10px;
            align-items: center;
            justify-items: center;
            align-content: center;
            justify-content: center;
        }
         div.container4 {
            display: grid;
            border: 3px solid blue;
            grid-template-columns: auto auto auto;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            padding: 10px;
            align-items: end;
            justify-items: end;
            align-content: end;
            justify-content: end;
        }
        
        
        div.item {
            border: 2px solid red;

</head>
